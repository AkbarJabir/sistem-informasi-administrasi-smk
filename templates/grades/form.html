{% extends "base.html" %}
{% block title %}Input Nilai Baru - Sistem Administrasi SMK{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square text-primary me-2"></i>Input Nilai Siswa</h4>
            </div>
            <div class="card-body p-3 p-sm-4">
                <form method="POST" action="{{ url_for('grades.add_post') }}">
                    <div class="mb-3">
                        <label class="form-label" for="student_id">Pilih Siswa <span class="text-danger">*</span></label>
                        <select class="form-select" id="student_id" name="student_id" required>
                            <option value="">-- Pilih Siswa --</option>
                            {% for s in students %}
                            <option value="{{ s.id }}">{{ s.nis }} - {{ s.name }} ({{ s['class'] }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label" for="subject">Mata Pelajaran <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="subject" name="subject" placeholder="Contoh: Pemrograman Berorientasi Objek" required>
                    </div>
                    
                    <div class="row g-3 mb-4">
                        <div class="col-12 col-sm-6">
                            <label class="form-label" for="semester">Semester <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="semester" name="semester" placeholder="Misal: Ganjil 2023/2024" required>
                        </div>
                        <div class="col-12 col-sm-6">
                            <label class="form-label" for="score">Nilai (0 - 100) <span class="text-danger">*</span></label>
                            <input type="number" class="form-control" id="score" name="score" min="0" max="100" step="0.1" placeholder="85.5" required>
                        </div>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a href="{{ url_for('grades.list_grades') }}" class="btn btn-outline-secondary">Batal</a>
                        <button type="submit" class="btn btn-primary"><i class="bi bi-save me-1"></i> Simpan Nilai</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
